services:
  - type: web
    name: yz-labs
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CONTACT_EMAIL_USER
        sync: false
      - key: CONTACT_EMAIL_PASS
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
